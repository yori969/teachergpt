<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111018">
  <title>TeacherGPT 2026</title>
  <meta name="description" content="Интерактивный AI-профиль для Дня учителя — TeacherGPT 2026">
  <style>
    :root{
      --bg:#0e0d13;--panel:#17151f;--card:#1d1a27;--text:#f5f3fa;
      --muted:#aaa4b8;--border:#353040;--accent:#1f75bb;--accent2:#56a9e2;
      --good:#5ee7a2;--bad:#ff8f9d;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,
      BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 50% -10%,rgba(31,117,187,.20),transparent 38%),
        var(--bg);
    }
    button,input{font:inherit}
    button{touch-action:manipulation}
    .wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:34px 0 60px}

    .brand-logo{
      display:block;width:min(180px,46vw);height:auto;margin:0 auto 14px;
      filter:drop-shadow(0 8px 24px rgba(31,117,187,.16))
    }
    .hero{padding:8px 0 24px}
    .badge{
      display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--border);
      border-radius:999px;color:var(--muted);font-size:12px;background:rgba(255,255,255,.02)
    }
    h1{font-size:clamp(34px,7vw,54px);line-height:.96;letter-spacing:-2.4px;margin:16px 0 14px}
    h1 span{color:var(--accent2)}
    .hero p{margin:0;max-width:680px;color:var(--muted);line-height:1.6}
    .panel{
      background:rgba(23,21,31,.88);border:1px solid var(--border);border-radius:24px;
      padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.18)
    }
    .namebox{display:grid;gap:12px}
    label{font-weight:750}
    input{
      width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--border);
      background:#100f15;color:var(--text);outline:none;font-size:16px
    }
    input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(31,117,187,.13)}
    .btn{
      min-height:46px;border:0;border-radius:13px;padding:12px 18px;background:var(--accent);
      color:#fff;font-weight:800;cursor:pointer
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
    .progress{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:24px}
    .progress i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
    .qnum{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.10em;text-transform:uppercase}
    .question{font-size:22px;font-weight:800;line-height:1.32;margin:9px 0 17px}
    .options{display:grid;gap:10px}
    .opt{
      width:100%;padding:15px;text-align:left;border:1px solid var(--border);border-radius:14px;
      background:transparent;color:var(--text);cursor:pointer;transition:.15s
    }
    .opt:hover{border-color:var(--accent2);transform:translateY(-1px);background:rgba(31,117,187,.06)}
    .result{text-align:center}
    .bigemoji{font-size:60px;line-height:1;margin:3px 0 14px}
    .result h2{font-size:31px;line-height:1.1;margin:0 0 7px}
    .muted{color:var(--muted);line-height:1.58}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:21px 0}
    .stat{border:1px solid var(--border);border-radius:14px;padding:13px 7px;background:rgba(255,255,255,.015)}
    .stat b{display:block;font-size:22px}.stat small{color:var(--muted);font-size:10px}
    .bars{text-align:left;margin:20px 0}
    .barrow{margin:12px 0}.barhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}
    .track{height:7px;background:var(--border);border-radius:99px;overflow:hidden}
    .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
    .quote{
      padding:15px;text-align:left;border-left:3px solid var(--accent);
      background:rgba(31,117,187,.055);border-radius:0 13px 13px 0;margin:18px 0;line-height:1.55
    }
    .certificate{
      border:1px dashed var(--accent2);padding:22px;border-radius:18px;margin:18px 0;
      background:rgba(31,117,187,.045)
    }
    .cert-title{font-size:11px;letter-spacing:.14em;color:var(--muted)}
    .cert-name{font-size:29px;font-weight:900;margin:8px 0}
    .cert-status{font-size:13px;line-height:1.45}
    .actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
    .game-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .score{font-weight:850}
    .statement{font-size:23px;font-weight:850;line-height:1.35;padding:25px 2px}
    .game-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .feedback{margin-top:13px;padding:13px;border-radius:13px;line-height:1.5;background:rgba(255,255,255,.04)}
    .feedback.good{border:1px solid rgba(94,231,162,.35)}.feedback.bad{border:1px solid rgba(255,143,157,.35)}
    .hidden{display:none!important}
    .footer{text-align:center;color:#716b7d;font-size:11px;margin-top:18px}
    @media(max-width:600px){
      .wrap{width:min(100% - 22px,760px);padding-top:22px}
      .panel{padding:17px;border-radius:19px}.stats{grid-template-columns:repeat(2,1fr)}
      .game-actions{grid-template-columns:1fr}.question{font-size:19px}.statement{font-size:20px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

      <div class="badge">🤖 TeacherGPT 2026 · AI-праздник для педагогов</div>
      <h1>Мы обучили нейросеть<br><span>понимать учителей.</span></h1>
      <p>Введите имя, пройдите короткую диагностику и узнайте свой педагогический AI-профиль.</p>
    </section>

    <section id="screen" class="panel" aria-live="polite"></section>
    <div class="footer">TeacherGPT 2026 · интерактивная версия · данные не отправляются на сервер</div>
  </main>

<script>
(() => {
  "use strict";

  const screen = document.getElementById("screen");
  let name = "";
  let answers = [];
  let questionIndex = 0;
  let gameIndex = 0;
  let gameScore = 0;

  const questions = [
    ["Ученик говорит: «Я сделал, но файл почему-то исчез». Что отвечаете?",
      ["«Покажи, что именно ты делал».","«Ну конечно…»","«Спокойно, сейчас разберёмся».","«А резервная копия есть?»"]],
    ["До урока осталось две минуты, а техника решила, что сегодня выходной.",
      ["Импровизирую.","Ищу другой компьютер.","Глубоко дышу и перезагружаю.","Говорю классу: «Сегодня у нас необычный урок»."]],
    ["Самая сильная суперспособность хорошего учителя — это…",
      ["Объяснить сложное простыми словами.","Помнить 30 имён одновременно.","Сохранять спокойствие.","Уметь заинтересовать даже после фразы «а это нам зачем?»"]],
    ["Ученик спрашивает: «А это точно будет на оценку?»",
      ["«Нет, сегодня без оценок».","«А почему тебя это так интересует?»","«Будет полезнее, если ты сделаешь это для себя».","«Теперь — точно будет»."]],
    ["После тяжёлого учебного дня хочется…",
      ["Тишины.","Кофе.","Компьютерной игры или фильма.","Чтобы завтра внезапно оказался выходной."]],
    ["Как вы относитесь к нейросетям в образовании?",
      ["Как к инструменту.","Как к помощнику.","Как к новой возможности для творчества.","Главное — научить детей пользоваться ими правильно."]]
  ];

  const statements = [
    ["«Коллеги, напоминаю: дедлайн был вчера, но я всё ещё верю в вас».", 1],
    ["«Сегодня мы рассмотрим тему, которая изменит ваше представление о мире».", 0],
    ["«Пожалуйста, пока не открывайте компьютеры. Сейчас будет важная часть».", 0],
    ["«Я не злюсь. Я просто уже третий раз объясняю одно и то же».", 1],
    ["«Если не знаете, что делать, начните с формулировки проблемы».", 0],
    ["«Это займёт буквально пять минут».", 1],
    ["«Самое важное сегодня — не бояться ошибаться».", 0],
    ["«Ребята, кто-нибудь видел мой переходник?»", 1]
  ];

  const profiles = [
    ["🧠","Архитектор спокойствия","Вы умеете сначала разобраться в ситуации, а уже потом включать режим спасения урока."],
    ["🛠️","Мастер импровизации","Когда реальность ломает план урока, вы просто создаёте новый план на ходу."],
    ["😎","Педагог-переговорщик","Вы умеете превращать «не хочу» в «ладно, попробую». Редкий педагогический навык."],
    ["☕","Легенда учебного года","Вы знаете главный секрет профессии: спокойствие, юмор и иногда очень своевременный кофе."]
  ];

  function esc(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[char]));
  }

  function start() {
    screen.innerHTML = `
      <div class="namebox">
        <label for="teacherName">Как вас зовут?</label>
        <input id="teacherName" maxlength="40" placeholder="Например, Максим" autocomplete="name">
        <button class="btn" id="startBtn" type="button">Начать диагностику →</button>
      </div>`;
    const input = document.getElementById("teacherName");
    const go = () => {
      name = input.value.trim() || "Коллега";
      answers = [];
      questionIndex = 0;
      renderQuestion();
    };
    document.getElementById("startBtn").addEventListener("click", go);
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    input.focus();
  }

  function renderQuestion() {
    const [question, options] = questions[questionIndex];
    const percent = Math.round(questionIndex / questions.length * 100);
    screen.innerHTML = `
      <div class="progress" aria-label="Прогресс"><i style="width:${percent}%"></i></div>
      <div class="qnum">Диагностика · ${questionIndex + 1} / ${questions.length}</div>
      <div class="question">${esc(question)}</div>
      <div class="options">
        ${options.map((option, i) =>
          `<button class="opt" type="button" data-index="${i}">${esc(option)}</button>`
        ).join("")}
      </div>`;
    screen.querySelectorAll(".opt").forEach(button => {
      button.addEventListener("click", () => {
        answers.push(Number(button.dataset.index));
        questionIndex++;
        if (questionIndex < questions.length) renderQuestion();
        else showProfile();
      });
    });
  }

  function showProfile() {
    const counts = [0,0,0,0];
    answers.forEach(a => counts[a]++);
    const dominant = counts.indexOf(Math.max(...counts));
    const profile = profiles[dominant];

    const average = answers.reduce((sum, a) => sum + a, 0) / answers.length;
    const ai = Math.min(99, 78 + Math.round(average * 5));
    const chaos = Math.min(99, 35 + counts[1] * 10 + counts[3] * 5);
    const patience = Math.min(99, 65 + counts[0] * 7 + counts[2] * 4);

    screen.innerHTML = `
      <div class="result">
        <div class="bigemoji">${profile[0]}</div>
        <div class="qnum">Педагогический AI-профиль</div>
        <h2>${profile[1]}</h2>
        <div class="muted">${profile[2]}</div>

        <div class="stats">
          <div class="stat"><b>${ai}%</b><small>AI-совместимость</small></div>
          <div class="stat"><b>${chaos}%</b><small>уровень хаоса</small></div>
          <div class="stat"><b>${patience}%</b><small>терпение</small></div>
          <div class="stat"><b>∞</b><small>опыт</small></div>
        </div>

        <div class="bars">
          ${bar("Нейросетевой вайб", ai)}
          ${bar("Педагогическое терпение", patience)}
          ${bar("Способность пережить учебный год", 97)}
        </div>

        <div class="certificate">
          <div class="cert-title">TEACHERGPT · СЕРТИФИКАЦИЯ 2026</div>
          <div class="cert-name">${esc(name)}</div>
          <div class="cert-status">Статус: <b>НЕЙРОСЕТЬ ОДОБРЯЕТ ЭТОГО УЧИТЕЛЯ</b></div>
        </div>

        <div class="quote">
          🤖 <b>Вердикт TeacherGPT:</b><br>
          «Анализ завершён. Риск профессионального выгорания модели не обнаружен.
          Риск фразы “а можно ещё одну попытку?” — высокий.»
        </div>

        <div class="actions">
          <button class="btn" id="playBtn" type="button">🎮 Проверить себя</button>
          <button class="btn secondary" id="restartBtn" type="button">Пройти заново</button>
        </div>
      </div>`;

    document.getElementById("playBtn").addEventListener("click", startGame);
    document.getElementById("restartBtn").addEventListener("click", start);
  }

  function bar(label, value) {
    return `
      <div class="barrow">
        <div class="barhead"><span>${label}</span><b>${value}%</b></div>
        <div class="track"><i style="width:${value}%"></i></div>
      </div>`;
  }

  function startGame() {
    gameIndex = 0;
    gameScore = 0;
    renderGame();
  }

  function renderGame() {
    if (gameIndex >= statements.length) {
      finishGame();
      return;
    }

    const [statement] = statements[gameIndex];
    screen.innerHTML = `
      <div class="game-head">
        <div>
          <div class="qnum">Учитель или нейросеть?</div>
          <b>Фраза ${gameIndex + 1} из ${statements.length}</b>
        </div>
        <div class="score">${gameScore} очк.</div>
      </div>
      <div class="statement">${esc(statement)}</div>
      <div class="game-actions">
        <button class="btn" id="humanBtn" type="button">👨‍🏫 Учитель</button>
        <button class="btn secondary" id="aiBtn" type="button">🤖 Нейросеть</button>
      </div>
      <div id="feedback" class="feedback hidden" aria-live="polite"></div>`;

    document.getElementById("humanBtn").addEventListener("click", () => answerGame(1));
    document.getElementById("aiBtn").addEventListener("click", () => answerGame(0));
  }

  function answerGame(choice) {
    const correct = choice === statements[gameIndex][1];
    if (correct) gameScore++;

    const feedback = document.getElementById("feedback");
    feedback.className = "feedback " + (correct ? "good" : "bad");
    feedback.innerHTML = (correct ? "✅ Верно! " : "❌ Не угадали. ") +
      (statements[gameIndex][1] ? "Фразу сказал бы настоящий учитель." : "Эту фразу сгенерировала нейросеть.");

    document.getElementById("humanBtn").disabled = true;
    document.getElementById("aiBtn").disabled = true;

    setTimeout(() => {
      gameIndex++;
      renderGame();
    }, 800);
  }

  function finishGame() {
    let message;
    if (gameScore >= 7) {
      message = "Невероятно. Нейросеть подозревает, что вы сами обучали её на учительских чатах.";
    } else if (gameScore >= 5) {
      message = "Очень достойно. Вы отлично распознаёте педагогический язык.";
    } else {
      message = "Нейросеть победила, но у вас ещё есть шанс на реванш.";
    }

    screen.innerHTML = `
      <div class="result">
        <div class="bigemoji">🏆</div>
        <div class="qnum">TeacherGPT · Финальная проверка</div>
        <h2>${esc(name)}, ${gameScore} / ${statements.length}</h2>
        <div class="muted">${message}</div>

        <div class="certificate">
          <div class="cert-title">ФИНАЛЬНЫЙ СТАТУС</div>
          <div class="cert-name">🏅 TEACHERGPT CERTIFIED</div>
          <div class="cert-status">${esc(name)} · версия 2026.10 · статус активен</div>
        </div>

        <div class="quote">
          ❤️ С Днём учителя! Пусть технологии помогают, ученики удивляют приятным,
          а хорошие коллеги всегда будут рядом.
        </div>

        <div class="actions">
          <button class="btn" id="againBtn" type="button">🔄 Сыграть ещё раз</button>
          <button class="btn secondary" id="homeBtn" type="button">На главную</button>
        </div>
      </div>`;

    document.getElementById("againBtn").addEventListener("click", startGame);
    document.getElementById("homeBtn").addEventListener("click", start);
  }

  start();
})();
</script>
